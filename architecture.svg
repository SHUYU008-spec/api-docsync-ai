<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="700" fill="#1a1a1a">API DocSync AI — System Architecture</text>

  <!-- node style helpers via groups -->
  <!-- 1. Python source -->
  <rect x="20" y="70" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="105" y="96" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Python source file</text>
  <text x="105" y="114" font-size="11" fill="#444" text-anchor="middle">(.py, parsed by ast,</text>
  <text x="105" y="128" font-size="11" fill="#444" text-anchor="middle">never executed)</text>

  <!-- 2. OpenAPI spec -->
  <rect x="20" y="280" width="170" height="62" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="105" y="306" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">OpenAPI 3.x</text>
  <text x="105" y="324" font-size="11" fill="#444" text-anchor="middle">JSON / YAML spec</text>

  <!-- 3. Code facts -->
  <rect x="230" y="70" width="170" height="62" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="315" y="96" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Extracted code facts</text>
  <text x="315" y="114" font-size="11" fill="#444" text-anchor="middle">routes / models /</text>
  <text x="315" y="128" font-size="11" fill="#444" text-anchor="middle">params / response_model</text>

  <!-- 4. Spec facts -->
  <rect x="230" y="280" width="170" height="62" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="315" y="306" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Extracted spec ops</text>
  <text x="315" y="324" font-size="11" fill="#444" text-anchor="middle">paths / schemas / params</text>

  <!-- 5. Detector -->
  <rect x="430" y="160" width="180" height="72" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="520" y="186" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Detector</text>
  <text x="520" y="204" font-size="11" fill="#444" text-anchor="middle">deterministic heuristic</text>
  <text x="520" y="218" font-size="11" fill="#444" text-anchor="middle">checks (offline, free)</text>

  <!-- 6. Findings -->
  <rect x="640" y="160" width="110" height="72" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="695" y="184" font-size="13" font-weight="600" fill="#1a1a1a" text-anchor="middle">Findings</text>
  <text x="695" y="202" font-size="10" fill="#444" text-anchor="middle">type_mismatch</text>
  <text x="695" y="216" font-size="10" fill="#444" text-anchor="middle">missing_field</text>
  <text x="695" y="228" font-size="10" fill="#444" text-anchor="middle">required_field ...</text>

  <!-- 7. Optional LLM (external) -->
  <rect x="430" y="300" width="180" height="78" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="324" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Optional LLM check</text>
  <text x="520" y="342" font-size="11" fill="#444" text-anchor="middle">OpenRouter API</text>
  <text x="520" y="358" font-size="11" fill="#a142f4" text-anchor="middle">(EXTERNAL, off by default)</text>

  <!-- external dependency note -->
  <text x="430" y="402" font-size="11" fill="#a142f4" font-style="italic">External dependency: OpenRouter LLM — only contacted when the optional check is enabled.</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a142f4"/>
    </marker>
  </defs>

  <!-- solid arrows -->
  <line x1="190" y1="101" x2="228" y2="101" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="311" x2="228" y2="311" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="101" x2="428" y2="170" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="311" x2="428" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="196" x2="638" y2="196" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dashed LLM arrows -->
  <line x1="520" y1="232" x2="520" y2="298" stroke="#a142f4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowD)"/>
  <line x1="650" y1="232" x2="610" y2="328" stroke="#a142f4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowD)"/>
</svg>
